<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龚逸航竞选主页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#94bce8',
                        primaryDark: '#305b94',
                    },
                    fontFamily: {
                        boldTitle: ['"Noto Serif SC"', 'serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {
                text-shadow: 2px  2px  8px rgba(0,0,0,.15);
            }
            .card-gradient {
                background: linear-gradient(135deg, #284b80, #1a3358);
            }
        }
    </style>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&display=swap');
        .scroll-wrap {
            scroll-snap-type: x mandatory;
        }
        .scroll-item {
            scroll-snap-align: center;
        }
    </style>
</head>
<body class=" bg-slate-5">
    <section class=" min-h-[70vh] flex items-center justify-center px-6 py-12">
        <div class=" text-center">
            <h1 class=" font-boldTitle text-[clamp(2.4rem,5vw,4.2rem)] font-black text-primaryDark text-shadow leading-tight">
                我做事，你100个percent放心
            </h1>
        </div>
    </section>

    <section class=" py-16">
        <div class=" overflow-x-auto scroll-wrap flex gap-6 px-4 pb-4">
            <a href=" " class=" scroll-item shrink-0 w-[280px] card-gradient text-white p-8 rounded-xl shadow-lg hover:scale-[1.03] transition-all">
                <h3 class=" text-xl font-bold mb-3 text-sky-200">个人优势 / 我的承诺</h3>
                <p class=" text-slate-200 text-sm">了解我的优势与服务初心</p >
            </a >
            <a href="plan.html" class=" scroll-item shrink-0 w-[280px] card-gradient text-white p-8 rounded-xl shadow-lg hover:scale-[1.03] transition-all">
                <h3 class=" text-xl font-bold mb-3 text-sky-200">竞选纲领 / 我要做的事</h3>
                <p class=" text-slate-200 text-sm">我的岗位规划与服务承诺</p >
            </a >
            <a href="vote.html" class=" scroll-item shrink-0 w-[280px] card-gradient text-white p-8 rounded-xl shadow-lg hover:scale-[1.03] transition-all">
                <h3 class=" text-xl font-bold mb-3 text-sky-200">投票入口 / 票数统计</h3>
                <p class=" text-slate-200 text-sm">为我投上一票（模拟效果）</p >
            </a >
        </div>
    </section>
</body>
</html>
