<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投票入口 / 票数统计</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#94bce8',
                        primaryDark: '#305b94',
                    }
                }
            }
        }
    </script>
</head>
<body class=" bg-slate-5">
    <header class=" bg-primary px-6 py-4 flex items-center">
        <a href=" " class=" mr-4 text-primaryDark font-medium">
            <i class="fa fa-arrow-left mr-1"></i> 返回首页
        </a >
        <h2 class=" text-xl font-bold text-primaryDark">投票入口 / 票数统计</h2>
    </header>
    <div class=" max-w-xl mx-auto px-6 py-16 text-center">
        <div class=" mb-8">
            <p class=" text-slate--600 mb-2">当前票数</p >
            <div id="voteCount" class=" text-6xl font-bold text-primaryDark">0</div>
        </div>
        <button id="voteBtn" class=" bg-primaryDark hover:bg-[#244470] text-white px-10 py-4 rounded-xl text-lg transition-all">
            为龚逸航投票
        </button>
        <p class=" mt-6 text-sm text-slate-500">⚠️ 仅模拟演示，刷新页面票数重置，无真实统计功能</p >
    </div>
    <script>
        let count = 0;
        const dom = document.getElementById('voteCount');
        const btn = document.getElementById('voteBtn');
        btn.onclick = () => {
            count += 1;
            dom.innerText = count;
            btn.disabled = true;
            btn.innerText = "✅ 感谢投票！";
            btn.classList.add(' opacity-60');
        }
    </script>
</body>
</html>
